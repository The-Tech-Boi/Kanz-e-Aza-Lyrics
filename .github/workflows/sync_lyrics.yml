name: Sync Lyrics from Firestore

on:
  schedule:
    - cron: "0 */6 * * *" # Run every 6 hours
    - cron: "*/15 * * * *" # Publish only when an admin edit is waiting
  # The Owner's merged pull request to lyrics/ is published at once. The
  # sync's own commits push with the workflow token, which starts no run.
  push:
    branches: [main]
    paths: ["lyrics/**"]
  workflow_dispatch: # Allow manual trigger

# Runs never overlap: each one publishes, then marks what it published.
concurrency:
  group: sync-lyrics
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v1.0.${{ github.run_number }}-${{ github.run_id }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          # The whole history: the run compares lyrics/ with the tree the
          # manifest names, and a restore reads a deleted file's last version.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Run Sync Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ONLY_IF_ADMIN_EDIT: ${{ github.event.schedule == '*/15 * * * *' && '1' || '' }}
        run: node scripts/sync_firestore_to_github.js

      - name: Validate Generated Manifest
        if: success() && hashFiles('output/manifest.json') != ''
        run: |
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('output/manifest.json','utf8')); if (manifest.latestReleaseTag !== process.env.RELEASE_TAG) throw new Error('latestReleaseTag mismatch'); const bad=manifest.updates.filter(u => !u.releaseTag); if (bad.length) throw new Error('missing releaseTag in manifest updates');"
          node -e "const fs=require('fs'), crypto=require('crypto'); const manifest=JSON.parse(fs.readFileSync('output/manifest.json','utf8')); for (const u of manifest.updates) { const f='output/'+u.assetName; if (fs.existsSync(f) && crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex') !== u.sha256) throw new Error('sha256 mismatch for '+u.assetName); }"

      - name: Create Release
        if: success() && hashFiles('output/manifest.json') != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: output/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Commit the Catalog and the Update
        if: success() && hashFiles('output/manifest.json') != ''
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # The website reads updates from the repo; browsers can't download release assets.
          mkdir -p updates
          cp output/update_*.json updates/
          git add manifest.json updates lyrics index
          git commit -F commit_message.txt
          git push

      # Last, so a failed release or commit leaves the lyrics unpublished for the next run.
      - name: Mark Lyrics Published
        if: success() && hashFiles('publish_marks.json') != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sync_firestore_to_github.js --mark-published publish_marks.json
