name: Check the Catalog

# Every pull request: the tests, every lyric file against the record rules,
# no lyric file deleted (Withdrawals happen from the website's Owner panel),
# no more lyric changes than one sync run publishes, and the update limits on
# the manifest and the update files it adds.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      # PR_BODY: a "Catalog-Publish: base-only" line in the description skips
      # the warning about more lyric changes than one run publishes.
      - name: Check Lyric Files
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/catalog.js check origin/${{ github.base_ref }}
